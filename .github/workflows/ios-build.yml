name: Build & Package iOS App (Kotlin Multiplatform)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍎 Build iOS Framework (macOS Runner)
    runs-on: macos-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: 🔧 Grant Executable Permissions to Gradlew
      run: chmod +x gradlew

    - name: 🛠️ Compile iOS Kotlin Multiplatform Framework (iosArm64)
      run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:linkReleaseFrameworkIosArm64

    - name: 📦 Archive iOS Framework Artifacts
      run: |
        mkdir -p build/ios-artifacts
        cp -R composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework build/ios-artifacts/ || true
        cd build/ios-artifacts && zip -r ../../ComposeApp-iOS-Framework.zip .

    - name: 🚀 Upload iOS Framework Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ComposeApp-iOS-Framework
        path: ComposeApp-iOS-Framework.zip
