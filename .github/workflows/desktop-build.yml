name: Desktop App (Windows installer)

on:
  push:
    branches: [ "main", "feature/desktop" ]
    paths: [ "composeApp/**", "gradle/**", "*.gradle.kts", ".github/workflows/desktop-build.yml" ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # google-services.json is gitignored; a placeholder is enough to configure the project.
    - name: 🔥 Placeholder google-services.json
      shell: bash
      run: |
        [ -f composeApp/google-services.json ] || cat > composeApp/google-services.json <<'JSON'
        {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.djran.constructioncalculator.multi"}},"oauth_client":[],"api_key":[{"current_key":"ci-placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
        JSON

    - name: 🖥️ Build Windows installer (.msi)
      run: ./gradlew :composeApp:packageMsi

    - name: 📦 Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: ProCalc-Windows-Installer
        path: composeApp/build/compose/binaries/main/msi/*.msi
